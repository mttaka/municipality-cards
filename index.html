<style>
  :root{

    --muted:#7A7264;
    --line:#D9D0BE;
    --tier0:#1F3A54;
    --tier1:#4F6B5C;

  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);

    padding:32px 16px 60px;
  }
  .wrap{max-width:1080px;margin:0 auto;}
  header{margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .titlebox h1{
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:30px;
    margin:0 0 6px;
    letter-spacing:.04em;
  }
  .sub{color:var(--muted);font-size:14px;letter-spacing:.02em;}
  .dropdowns{margin-bottom:18px;display:flex;flex-direction:column;gap:8px;max-width:420px;}
  .dropdown{position:relative;}
  .dropdown-toggle{
    width:100%;font-family:'Noto Sans JP',sans-serif;font-size:15px;font-weight:500;
    padding:12px 14px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);cursor:pointer;text-align:left;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .dropdown-toggle:hover{border-color:var(--clay);}
  .dropdown-toggle .chev{color:var(--muted);flex-shrink:0;transition:transform .15s ease;}
  .dropdown.open .dropdown-toggle .chev{transform:rotate(180deg);}
  .dropdown-menu{
    position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;
    max-height:340px;overflow-y:auto;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 8px 24px rgba(31,58,84,0.12);
    display:none;
  }
  .dropdown.open .dropdown-menu{display:block;}
  .dropdown-item{
    display:flex;align-items:center;gap:10px;padding:9px 14px;
    cursor:pointer;font-size:14px;
  }
  .dropdown-item:hover{background:var(--paper);}
  .dropdown-item.active{background:var(--clay-soft);}
  .dropdown-item .iname{font-weight:500;}
  .dropdown-item .ipop{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap;}
  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px;
  }
  .panel h2{
    font-family:'Shippori Mincho',serif;
    font-size:15px;
    font-weight:500;
    margin:0 0 10px;
    color:var(--ink-soft);
  }

  .name{font-family:'Shippori Mincho',serif;font-size:24px;font-weight:700;}
  .reading{font-size:12px;color:var(--muted);margin-top:-2px;margin-bottom:2px;}
  .badge{
    display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;
    color:#fff;white-space:nowrap;
  }
  .pop{font-size:12px;color:var(--muted);margin-top:6px;}
  .feature{
    margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);
    font-size:14px;line-height:1.75;
  }
  .subhead{
    font-size:12px;font-weight:500;color:var(--ink-soft);margin:16px 0 6px;
    display:flex;align-items:center;gap:6px;
  }
  .taglist{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{
    font-size:12px;padding:4px 10px;border-radius:999px;
    background:var(--paper);border:1px solid var(--line);color:var(--ink);
  }
  .tag.person{background:var(--clay-soft);border-color:var(--clay);color:#4A1B0C;}
  .empty-note{font-size:12px;color:var(--muted);}
  .maps-link{
    display:inline-block;margin-top:14px;font-size:12px;color:var(--ink-soft);
    text-decoration:none;border-bottom:1px solid var(--ink-soft);
  }
  .map-embed{
    width:100%;height:380px;border:0;border-radius:10px;margin-top:14px;
    border:1px solid var(--line);
  }
  .counter{font-size:12px;color:var(--muted);margin-top:14px;}
</style>
</head>

let currentPref = "41";
let current = 0;

function mapsUrlFor(d){
  return d.placeId
    ? `https://www.google.com/maps/place/?q=place_id:${d.placeId}`
    : `https://www.google.com/maps/search/?api=1&query=${d.lat},${d.lng}`;
}

function buildPrefMenu(){
  const menu = document.getElementById('prefMenu');
  menu.innerHTML = Object.keys(prefectures).map(code=>`
    <div class="dropdown-item${code===currentPref?' active':''}" onclick="selectPref('${code}')">
      <span class="iname">${prefectures[code].name}</span>
      <span class="ipop">${prefectures[code].municipalities.length}市区町村</span>
    </div>
  `).join('');
  document.getElementById('prefToggleLabel').textContent = prefectures[currentPref].name;
}

function buildCityMenu(){
  const menu = document.getElementById('cityMenu');
  const municipalities = prefectures[currentPref].municipalities;
  menu.innerHTML = municipalities.map((d,i)=>`
    <div class="dropdown-item${i===current?' active':''}" onclick="selectIndex(${i})">
      <span class="iname">${d.name}</span>
      <span class="ipop">${d.pop}</span>
    </div>
  `).join('');
  document.getElementById('cityToggleLabel').textContent = municipalities[current].name;
}

function toggleDropdown(id){
  const target = document.getElementById(id);
  const isOpen = target.classList.contains('open');
  document.querySelectorAll('.dropdown').forEach(dd=>dd.classList.remove('open'));
  if(!isOpen) target.classList.add('open');
}

document.addEventListener('click', function(e){
  if(!e.target.closest('.dropdown')){
    document.querySelectorAll('.dropdown').forEach(dd=>dd.classList.remove('open'));
  }
});

function tagRender(items, emptyText, cls){
  if(!items.length) return `<span class="empty-note">${emptyText}</span>`;
  return items.map(t=>`<span class="tag${cls?' '+cls:''}">${t}</span>`).join('');
}

function render(){
  const municipalities = prefectures[currentPref].municipalities;
  const d = municipalities[current];

  document.getElementById('pop').textContent = "人口 " + d.pop + "(概数)";
  document.getElementById('mapsLink').href = mapsUrlFor(d);
  document.getElementById('mapEmbed').src = `https://www.google.com/maps?q=${encodeURIComponent(d.name + ' ' + prefectures[currentPref].name)}&z=9&output=embed`;

  document.getElementById('name').textContent = d.name;
  document.getElementById('reading').textContent = d.reading;
  document.getElementById('feature').textContent = d.feature;
  document.getElementById('spots').innerHTML = tagRender(d.spots, "特に代表的なスポットは未登録です");
  document.getElementById('people').innerHTML = tagRender(d.people, "確実な情報がないため未登録です", "person");
  document.getElementById('counter').textContent = `${current+1} / ${municipalities.length}`;
}

function selectIndex(i){
  current = Number(i);
  buildCityMenu();
  document.querySelectorAll('.dropdown').forEach(dd=>dd.classList.remove('open'));
  render();
}

function selectPref(code){
  currentPref = code;
  current = 0;
  buildPrefMenu();
  buildCityMenu();
  document.querySelectorAll('.dropdown').forEach(dd=>dd.classList.remove('open'));
  render();
}

buildPrefMenu();
buildCityMenu();
render();
</script>
